
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #fce7f3);
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 40px 28px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 35px #00000018;
            text-align: center;
        }

        .check {
            width: 76px;
            height: 76px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            font-size: 42px;
        }

        h1 {
            color: #166534;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
        }

        a {
            display: block;
            margin-top: 24px;
            padding: 14px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="check">✓</div>

        <h1>Registration Successful!</h1>

        <p>
            Your account has been created successfully.
            You can now log in using your username or email and password.
        </p>

        <a href="/login/">Continue to Login</a>
    </main>
</body>
</html>
