
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #fce7f3);
        }

        .card {
            width: 90%;
            max-width: 480px;
            padding: 40px 28px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 35px #00000018;
        }

        h1 {
            color: #3730a3;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        a {
            display: block;
            margin-top: 18px;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            background: #4f46e5;
            color: white;
            font-weight: bold;
        }

        a:hover {
            background: #3730a3;
        }

        .login {
            background: #0f766e;
        }

        .login:hover {
            background: #115e59;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome!</h1>
        <p>Create your account and get started.</p>

        <a href="/register/">Create Account</a>
        <a href="/login/" class="login">Login</a>
    </div>
</body>
</html>
