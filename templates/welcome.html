
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Registration App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8efff, #f8eaff);
        }

        .card {
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
        }

        .check {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e1f8e9;
            color: #159447;
            font-size: 42px;
        }

        h1 {
            margin-bottom: 12px;
            color: #303b70;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        .logout-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            border-radius: 8px;
            background: #505fd0;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .logout-btn:hover {
            background: #3948b5;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="check">&#10003;</div>

        <h1>Welcome!</h1>

        <p>
            You have successfully logged in to your account.
        </p>

        <p>
            Thank you for using our Registration Application.
        </p>

        <a href="/login/" class="logout-btn">Logout</a>
    </div>
</body>
</html>
